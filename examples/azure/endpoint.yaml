# Azure ML managed online endpoint definition (CLI v2 schema).
# https://learn.microsoft.com/azure/machine-learning/reference-yaml-endpoint-online
#
# Create with:
#   az ml online-endpoint create -f examples/azure/endpoint.yaml -g <resource-group> -w <workspace>
#
# Validate offline (no Azure credentials needed) with:
#   python -m src.main azure-plan --endpoint examples/azure/endpoint.yaml \
#       --deployment examples/azure/deployment.yaml

$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineEndpoint.schema.json
name: ml-cloud-deploy-endpoint
auth_mode: key
description: >
  Managed online endpoint for the ml-cloud-deployment-patterns sample model
  (Phase 2: Azure ML deployment example). Independent portfolio project --
  no employer/client data or credentials.
