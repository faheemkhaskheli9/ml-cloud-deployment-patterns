[project]
name = "ml-cloud-deployment-patterns"
version = "0.1.0"
description = "Cloud ML Deployment Examples"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "numpy>=1.24",
    "pydantic>=2.5,<3",
]

[project.optional-dependencies]
# Cloud SDKs are only needed by the per-provider examples (Phases 2-4).
azure = ["azureml-core>=1.55", "azure-identity>=1.15"]
aws = ["boto3>=1.34", "sagemaker>=2.200"]
gcp = ["google-cloud-aiplatform>=1.40"]
dev = ["pytest>=7.4", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["src"]
